<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <style>
    .qm-ink{ fill:#181C29; }
    .qm-line{ stroke:#4a5568; }
    @media (prefers-color-scheme: dark){
      .qm-ink{ fill:#EDEFF5; }
      .qm-line{ stroke:#8C93A8; }
    }
  </style>

          <defs>
          <filter id="qm-glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur1" />
          <feGaussianBlur stdDeviation="24" result="blur2" />
          <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
          </feMerge>
          </filter>
          <filter id="qm-glow-pink" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="12" result="blur1" />
          <feGaussianBlur stdDeviation="24" result="blur2" />
          <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
          </feMerge>
          </filter>
          <filter id="qm-node-glow-cyan" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
          </feMerge>
          </filter>
          <filter id="qm-node-glow-pink" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
          </feMerge>
          </filter>
          <clipPath id="qm-left-half">
          <rect x="0" y="0" width="450" height="650" />
          </clipPath>
          <clipPath id="qm-right-half">
          <rect x="450" y="0" width="450" height="650" />
          </clipPath>
          </defs>
          
          <line class="qm-line" x1="450" y1="50" x2="450" y2="600" stroke-width="1.5" />
          
          <g clip-path="url(#qm-left-half)">
          <path d="M 265,100 L 370,100 L 450,270 L 530,100 L 635,100 L 495,325 L 635,550 L 530,550 L 450,380 L 370,550 L 265,550 L 405,325 Z" fill="none" stroke="#00e5ff" stroke-width="28" opacity="0.65" filter="url(#qm-glow-cyan)" />
          </g>
          
          <g clip-path="url(#qm-right-half)">
          <path d="M 265,100 L 370,100 L 450,270 L 530,100 L 635,100 L 495,325 L 635,550 L 530,550 L 450,380 L 370,550 L 265,550 L 405,325 Z" fill="none" stroke="#ff2a8d" stroke-width="28" opacity="0.65" filter="url(#qm-glow-pink)" />
          </g>
          
          <path class="qm-ink qm-line" d="M 265,100 L 370,100 L 450,270 L 530,100 L 635,100 L 495,325 L 635,550 L 530,550 L 450,380 L 370,550 L 265,550 L 405,325 Z" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="10" />
          
          <g class="qm-line" stroke-width="2.5" stroke-linecap="round">
          <line x1="380" y1="180" x2="433" y2="325" />
          <line x1="380" y1="470" x2="433" y2="325" />
          <line x1="520" y1="180" x2="467" y2="325" />
          <line x1="520" y1="470" x2="467" y2="325" />
          </g>
          
          <circle cx="380" cy="180" r="7" fill="#00d2ff" filter="url(#qm-node-glow-cyan)" />
          <circle class="qm-ink" cx="380" cy="180" r="2.5" />
          <circle cx="380" cy="470" r="7" fill="#00d2ff" filter="url(#qm-node-glow-cyan)" />
          <circle class="qm-ink" cx="380" cy="470" r="2.5" />
          <circle cx="433" cy="325" r="7" fill="#00d2ff" filter="url(#qm-node-glow-cyan)" />
          <circle class="qm-ink" cx="433" cy="325" r="2.5" />
          
          <circle cx="520" cy="180" r="7" fill="#ff3385" filter="url(#qm-node-glow-pink)" />
          <circle class="qm-ink" cx="520" cy="180" r="2.5" />
          <circle cx="520" cy="470" r="7" fill="#ff3385" filter="url(#qm-node-glow-pink)" />
          <circle class="qm-ink" cx="520" cy="470" r="2.5" />
          <circle cx="467" cy="325" r="7" fill="#ff3385" filter="url(#qm-node-glow-pink)" />
          <circle class="qm-ink" cx="467" cy="325" r="2.5" />
          
          <line class="qm-line" x1="433" y1="325" x2="260" y2="325" stroke-width="2.5" />
          <circle class="qm-line" cx="260" cy="325" r="22" fill="none" stroke-width="2.5" />
          <circle class="qm-line" cx="260" cy="325" r="13" fill="none" stroke-width="2.5" />
          <circle cx="260" cy="325" r="7" fill="#8b5cf6" filter="url(#qm-node-glow-cyan)" />
          <circle class="qm-ink" cx="260" cy="325" r="2.5" />
          
          <polyline class="qm-line" points="245,310 200,210 110,210" fill="none" stroke-width="2.5" stroke-linejoin="round" />
          <polyline class="qm-line" points="245,340 200,440 110,440" fill="none" stroke-width="2.5" stroke-linejoin="round" />
          
          <circle class="qm-ink qm-line" cx="200" cy="210" r="14" stroke-width="2.5" />
          <circle cx="200" cy="210" r="6" fill="#00d2ff" filter="url(#qm-node-glow-cyan)" />
          <circle class="qm-ink" cx="200" cy="210" r="2" />
          
          <circle class="qm-ink qm-line" cx="110" cy="210" r="14" stroke-width="2.5" />
          <circle cx="110" cy="210" r="6" fill="#00d2ff" filter="url(#qm-node-glow-cyan)" />
          <circle class="qm-ink" cx="110" cy="210" r="2" />
          
          <circle class="qm-ink qm-line" cx="200" cy="440" r="14" stroke-width="2.5" />
          <circle cx="200" cy="440" r="6" fill="#ff3385" filter="url(#qm-node-glow-pink)" />
          <circle class="qm-ink" cx="200" cy="440" r="2" />
          
          <circle class="qm-ink qm-line" cx="110" cy="440" r="11" stroke-width="2.5" />
          
          <line class="qm-line" x1="467" y1="325" x2="575" y2="325" stroke-width="2.5" />
          <circle class="qm-ink qm-line" cx="575" cy="325" r="6" stroke-width="2.5" />
          
          <line class="qm-line" x1="575" y1="325" x2="535" y2="260" stroke-width="2.5" />
          <line class="qm-line" x1="575" y1="325" x2="535" y2="390" stroke-width="2.5" />
          
          <line class="qm-line" x1="585" y1="319" x2="640" y2="319" stroke-width="2.5" />
          <line class="qm-line" x1="585" y1="331" x2="640" y2="331" stroke-width="2.5" />
          
          <line class="qm-line" x1="640" y1="325" x2="720" y2="210" stroke-width="2.5" />
          <line class="qm-line" x1="640" y1="325" x2="720" y2="440" stroke-width="2.5" />
          
          <circle class="qm-ink qm-line" cx="720" cy="210" r="14" stroke-width="2.5" />
          <circle cx="720" cy="210" r="6" fill="#ff3385" filter="url(#qm-node-glow-pink)" />
          <circle class="qm-ink" cx="720" cy="210" r="2" />
          
          <circle class="qm-ink qm-line" cx="720" cy="440" r="11" stroke-width="2.5" />
          </svg>