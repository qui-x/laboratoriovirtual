<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="#conteudo" class="skip-link">Pular para o conteúdo principal</a>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="f-protanopia">
      <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="f-deuteranopia">
      <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="f-tritanopia">
      <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="f-acromatopsia">
      <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
    </filter>
  </defs>
</svg>

<div id="colorblindOverlay" aria-hidden="true"></div>

<div class="shell">

  <header class="top">
    <div class="brand">
      <a href="index.html" class="conta-voltar" aria-label="Voltar para a Central">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
      <h1 class="brand-name">
        <span class="qm-sr-only">QuímiX</span>
        <span aria-hidden="true">Qu<span class="i-bond">ı<svg class="i-bond-accent" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <defs>
                  <linearGradient id="qm-i-bond-grad" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#00e5ff"/>
                    <stop offset="1" stop-color="#ff2a8d"/>
                  </linearGradient>
                </defs>
                <line x1="4" y1="16.5" x2="15" y2="4.5" stroke="url(#qm-i-bond-grad)" stroke-width="2.3" stroke-linecap="round"/>
                <circle cx="4" cy="16.5" r="2.1" fill="#00c2e6"/>
                <circle cx="4" cy="16.5" r="0.8" fill="#ffffff"/>
                <circle cx="15" cy="4.5" r="2.8" fill="#ff2a8d"/>
                <circle cx="15" cy="4.5" r="1" fill="#ffffff"/>
              </svg></span>mi</span>
      </h1>
    </div>
  </header>

  <!-- Sem sessão válida: redireciona para index.html (ver guarda-conta.js) — nunca mostra dados de conta sem sessão confirmada. -->
  <main id="conteudo-conta" class="conta-pagina hidden">
    <h2 class="section-title">Minha conta</h2>

    <div class="conta-card conta-card--pagina" id="conta-info"></div>

    <div id="conta-membro-area" class="hidden conta-secao">
      <h3 class="conta-secao-title">Trocar senha</h3>
      <p class="panel-hint">Esqueceu sua senha ou quer trocá-la? Solicite abaixo — um administrador vai liberar um código temporário por e-mail.</p>
      <button type="button" class="launch-submit" id="solicitar-reset-btn" onclick="handleSolicitarReset()">Solicitar nova senha</button>
      <p class="panel-hint" id="conta-reset-status" style="margin-top:10px; margin-bottom:0;"></p>
    </div>
    <div id="conta-admin-area" class="hidden conta-secao">
      <h3 class="conta-secao-title">Trocar senha</h3>
      <p class="panel-hint" style="margin-bottom:0;">Esqueceu sua própria senha? Saia da conta e use "Esqueceu sua senha?" na tela de login.</p>
    </div>

    <div class="conta-secao">
      <button type="button" class="btn-secondary" onclick="handleLogout()">Sair da conta</button>
    </div>
  </main>

</div>

<script src="config-api.js"></script>
<script src="estado-sessao.js"></script>
<script src="identidade.js"></script>
<script src="conta.js"></script>
<script src="guarda-conta.js"></script>
</body>
</html>
